<div class="wp-site-blocks">
<!--CABECALHO-->
<main class="wp-block-group wp-container">
  <h1 class="wp-block-post-title">Minha conta</h1>
  <div class="woocommerce">
    <div class="u-columns col2-set" id="customer_login">
      <div class="u-column1 col-1">
        <h2>Acessar</h2>
        <form class="woocommerce-form woocommerce-form-login login">
          <p class="woocommerce-form-row form-row-wide">
            <label for="username">E-mail <span class="required">*</span></label>
            <input class="woocommerce-Input woocommerce-Input--text input-text" type="text" id="username" value="">
          </p>
          <p class="woocommerce-form-row form-row-wide">
            <label for="password">Senha <span class="required">*</span></label>
            <input class="woocommerce-Input woocommerce-Input--text input-text" type="password" id="password">
          </p>
          <p class="form-row">
            <label class="woocommerce-form__label-for-checkbox"><input class="woocommerce-form__input-checkbox" type="checkbox"> <span>Lembrar de mim</span></label>
            <button type="submit" class="woocommerce-button button woocommerce-form-login__submit">Acessar</button>
          </p>
          <p class="woocommerce-LostPassword lost_password"><a href="#">Perdeu a senha?</a></p>
        </form>
      </div>
    </div>
  </div>
</main>
<!--RODAPE-->
</div>
